services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: snips_test
      POSTGRES_USER: snips
      POSTGRES_PASSWORD: snips
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snips -d snips_test"]
      interval: 1s
      timeout: 5s
      retries: 30
